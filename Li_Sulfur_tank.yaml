#===============================================================================
#  input_template.yaml
#
#  User inputs for bat-can model creation and running.
#===============================================================================

cell-description:
    
  separator:
    electrolyte-phase: 'electrolyte' # Cantera phase name
    n_points: 1
    thickness: 30e-2  # separator thickness, m
    transport:
      mobile-ion:  'Li+(e)' # Species name for Li+ in elyte.
      model: 'dilute-solution'
      diffusion-coefficients:
        - species: 'Li+(e)'
          D_k: 1e-5
          C_k: 1.024e-6 # kmol_k/m^3
          name: 'Li+(e)'
          name-plot: '$\rm Li+$'
        - species: S8(e)
          D_k: 1e-11
          C_k: 1.943e-6 # kmol_k/m^3
          name: S8(e)
          name-plot: '$\rm S_8$'
        - species: S82-(e)
          D_k: 1e-11
          C_k: 1.943e-6 # kmol_k/m^3
          name: S82-(e)
          name-plot: '$\rm S_8^{2-}$'
        - species: Li2S8(e)
          D_k: 6e-11
          C_k: 1.821e-6 # kmol_k/m^3
          name: Li2S8(e)
          name-plot: '$\rm Li_2S_8$'
        - species: Li2S7(e)
          D_k: 1e-10
          C_k: 1.0e-6 # kmol_k/m^3
          name: Li2S7(e)
          name-plot: '$\rm Li_2S_7$'
        - species: Li2S6(e)
          D_k: 6e-11
          C_k: 3.314e-6 # kmol_k/m^3
          name: Li2S6(e)
          name-plot: '$\rm Li_2S_6$'
        - species: Li2S5(e)
          D_k: 1e-10
          C_k: 1.0e-6 # kmol_k/m^3
          name: Li2S5(e)
          name-plot: '$\rm Li_2S_5$'
        - species: Li2S4(e)
          D_k: 1e-10
          C_k: 2.046e-6 # kmol_k/m^3
          name: Li2S4(e)
          name-plot: '$\rm Li_2S_4$'
        - species: Li2S3(e)
          D_k: 1e-10
          C_k: 1.0e-6 # kmol_k/m^3
          name: Li2S3(e)
          name-plot: '$\rm Li_2S_3$'
        - species: Li2S2(e)
          D_k: 1e-10
          C_k: 5.348e-6 # kmol_k/m^3
          name: Li2S2(e)
          name-plot: '$\rm Li_2S_2$'
        - species: Li2S(e)
          D_k: 1.1e-10
          C_k: 1.456e-6 # kmol_k/m^3
          name: 'Li2S(e)'
          name-plot: '$\rm Li_2S$'
   
# Simulation parameters:
parameters:
  T: 25.15 C
  P: 101325 Pa
  simulations:
    i_ext: 0.0 A/cm2 # the external current
    time_max: 10 # max time for the simulation, [s]

# Cantera inputs:
phases:
- name: electrolyte
  thermo: ideal-condensed
  elements: [Li, E, S]
  species: [Li+(e), S8(e), S82-(e), Li2S8(e), Li2S7(e), Li2S6(e), Li2S5(e), Li2S4(e), Li2S3(e), Li2S2(e), Li2S(e)]
  state:
    T: 300.0
    P: 1 atm
    #X: {Li+(e): 1.0e-5, S8(e): 2.0e-2, Li2S(e): 8.0e-10}
  standard-concentration-basis: unity
  kinetics: gas
  reactions: [bulk-elyte-reactions]

species:
- name: Li(b)
  composition: {Li: 1}
  thermo:
    model: constant-cp
    h0: 0.0 kJ/mol
    s0: 29.1 J/mol/K
  equation-of-state:
    model: constant-volume
    molar-volume: 12.998 cm^3/mol
- name: Li+(e)
  composition: {Li: 1, E: -1}
  thermo:
    model: constant-cp
    h0: -278 kJ/mol
    s0: 0.0 J/mol/K
  equation-of-state:
    model: constant-volume
    molar-volume: 5.51 cm^3/mol

- name: S8(s)
  composition: {S: 8}
  thermo:
    model: constant-cp
    h0: 0.0 kJ/mol
    s0: 0.0 J/mol/K
