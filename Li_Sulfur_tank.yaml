bulk-elyte-reactions:
- equation: 16 Li+(e) + 8 S82-(e) <=> 7 S8(e) + 8 Li2S(e)
  id: bulk_1
  rate-constant: {A: 1.1e-4, b: 0.0, Ea: 0.0}
- equation: 8 Li+(e) + 4 S82-(e) <=> 3 S8(e) + 4 Li2S2(e)
  id: bulk_2
  rate-constant: {A: 1.1e-12, b: 0.0, Ea: 0.0}
- equation: 16 Li+(e) + 8 S82-(e) <=> 5 S8(e) + 8 Li2S3(e)
  id: bulk_3
  rate-constant: {A: 1.1e-12, b: 0.0, Ea: 0.0}
- equation: 16 Li+(e) + 8 S82-(e) <=> 4 S8(e) + 8 Li2S4(e)
  id: bulk_4
  rate-constant: {A: 1.1e-12, b: 0.0, Ea: 0.0}
- equation: 16 Li+(e) + 8 S82-(e) <=> 3 S8(e) + 8 Li2S5(e)
  id: bulk_5
  rate-constant: {A: 1.1e-12, b: 0.0, Ea: 0.0}
- equation: 16 Li+(e) + 8 S82-(e) <=> 2 S8(e) + 8 Li2S6(e)
  id: bulk_6
  rate-constant: {A: 1.1e-12, b: 0.0, Ea: 0.0}
- equation: 16 Li+(e) + 8 S82-(e) <=> S8(e) + 8 Li2S7(e)
  id: bulk_7
  rate-constant: {A: 1.1e-12, b: 0.0, Ea: 0.0}
- equation: 2 Li+(e) + S82-(e) <=> Li2S8(e)
  id: bulk_8
  rate-constant: {A: 1.1e-12, b: 0.0, Ea: 0.0}

# I think all other equations are combinations of these equations
# Ex: -2*bulk_2 + bulk_1 + bulk_3 = bulk_9
- equation: 2 Li2S2(e) <=> Li2S(e) + Li2S3(e)
  id: bulk_9
  rate-constant: {A: 1.1e-12, b: 0.0, Ea: 0.0}