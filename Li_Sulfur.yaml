#===============================================================================
#  input_template.yaml
#
#  User inputs for bat-can model creation and running.
#===============================================================================

cell-description:
  anode:
    bulk-phase: 'lithium_metal' # Cantera phase name
    surf-phase: 'lithium_electrolyte' # Cantera phase name
    conductor-phase: 'electron' # Cantera phase name
    thickness: 15e-6 # Initial anode thickness, [m]
    C_dl: 1.5e-1 # [F/m2]
    
  separator:
    phi_0: 1.0 # Initial electric potential, V
    electrolyte-phase: 'electrolyte' # Cantera phase name
    n_points: 3
    transport:
      mobile-ion:  'Li+(e)' # Species name for Li+ in elyte.
      model: 'dilute-solution'
      diffusion-coefficients:
        - species: 'Li+(e)'
          D_k: 1e-10
          C_k: 1.024 # kmol_k/m^3
          name: '$\rm Li+$'
        - species: S8(e)
          D_k: 1e-11
          C_k: 1.943e-2 # kmol_k/m^3
          name: '$\rm S_8$'
        - species: Li2S(e)
          D_k: 1e-10
          C_k: 8.456e-13 # kmol_k/m^3
          name: '$\rm Li_2S$'
   
  cathode:
    phi_0: 3.4 # Initial electric potential, V
    nucleation:
      - species: 'Li2S'
        num-buckets: 150
        bucket-thciness: 8e-10
      - species: 'S8'
        num-buckets: 150
        bucket-thciness: 8e-10


    
# Simulation parameters:
parameters:
  T: 25.15 C
  P: 101325 Pa
  simulations:
    type: 'CC_cycle' # Constant current cycling
    i_ext: 0.01 A/cm2 # the external current
    time_max: 2 # max time for the simulation, [s]
    number-bins:
      Li2S: 10
      S8: 10

# Cantera inputs:

phases:
- name: lithium_metal
  thermo: fixed-stoichiometry
  species: ['Li(b)']
  density: 0.534 g/cm^3
  state:
    T: 300.0 K
    P: 1 atm

- name: electron
  thermo: electron-cloud
  elements: [E]
  species: [electron]
  state:
    X: {electron: 1.0}
  density: 1.0 kg/m^3

- name: lithium_electrolyte
  thermo: ideal-surface
  species: [(dummy)]
  kinetics: surface
  reactions: [lithium-electrolyte-reactions]
  site-density: 3.48e-2

- name: electrolyte
  thermo: ideal-condensed
  elements: [Li, E, S]
  species: [Li+(e), S8(e), Li2S(e)]
  state:
    T: 300.0
    P: 1 atm
    X: {Li+(e): 1.0, S8(e): 2.0e-2, Li2S(e): 8.0e-10}
  standard-concentration-basis: unity

species:
- name: electron
  composition: {E: 1}
  thermo:
    model: constant-cp
    h0: 0.0 kJ/mol
    s0: 0.0 J/mol/K
- name: Li(b)
  composition: {Li: 1}
  thermo:
    model: constant-cp
    h0: 0.0 kJ/mol
    s0: 29.1 J/mol/K
  equation-of-state:
    model: constant-volume
    molar-volume: 12.998 cm^3/mol
- name: Li+(e)
  composition: {Li: 1, E: -1}
  thermo:
    model: constant-cp
    h0: -278 kJ/mol
    s0: 0.0 J/mol/K
  equation-of-state:
    model: constant-volume
    molar-volume: 5.51 cm^3/mol
- name: S8(e)
  composition: {S: 8}
  thermo:
    model: constant-cp
    h0: 16.1 kJ/mol
    s0: 0.0 J/mol/K
  equation-of-state:
    model: constant-volume
    molar-volume: 123.90338 cm^3/mol
- name: Li2S(e)
  composition: {Li: 2, S: 1}
  thermo:
    model: constant-cp
    h0: -1004.09 kJ/mol
    s0: 0.0 J/mol/K
  equation-of-state:
    model: constant-volume
    molar-volume: 27.5 cm^3/mol
- name: (dummy)
  composition: {}
  thermo:
    model: constant-cp
    h0: 0.0 kJ/mol
    s0: 0.0 J/mol/K
  note: Dummy species (needed for defining the interfaces)

lithium-electrolyte-reactions:
- equation: Li(b) <=> Li+(e) + electron
  id: lithium_faradaic_reaction
  rate-constant: {A: 2.0e-08, b: 0.0, Ea: 0.0}
  beta: 0.5