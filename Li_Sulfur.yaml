    model: constant-cp
    h0: 0.0 kJ/mol
    s0: 29.1 J/mol/K
  equation-of-state:
    model: constant-volume
    molar-volume: 12.998 cm^3/mol
- name: Li+(e)
  composition: {Li: 1, E: -1}
  thermo:
    model: constant-cp
    h0: -278 kJ/mol 
    s0: 0.0 J/mol/K
  equation-of-state:
    model: constant-volume
    molar-volume: 5.51 cm^3/mol
- name: S8(s)
  composition: {S: 8}
  thermo:
    model: constant-cp
    h0: 0.0 kJ/mol
    s0: 0.0 J/mol/K
- name: S8(e)
  composition: {S: 8}
  thermo:
    model: constant-cp
    h0: 16.1 kJ/mol
    s0: 0.0 J/mol/K
  equation-of-state:
    model: constant-volume
    molar-volume: 123.90338 cm^3/mol
- name: S82-(e)
  composition: {S: 8, E: 2}
  thermo:
    model: constant-cp
    h0: -450.78 kJ/mol
    s0: 0.0 J/mol/K
  equation-of-state:
    model: constant-volume
    molar-volume: 86.156 cm^3/mol
- name: Li2S(e)
  composition: {Li: 2, S: 1}
  thermo:
    model: constant-cp
    h0: -1004.09 kJ/mol
    s0: 0.0 J/mol/K
  equation-of-state:
    model: constant-volume
    molar-volume: 27.5 cm^3/mol
- name: Li2S(s)
  composition: {Li: 2, S: 1}
  thermo:
    model: constant-cp
    h0: -1004.09 kJ/mol
    s0: 0.0 J/mol/K
  equation-of-state:
    model: constant-volume
    molar-volume: 27.5 cm^3/mol
- name: (dummy)
  composition: {}
  thermo:
    model: constant-cp
    h0: 0.0 kJ/mol
    s0: 0.0 J/mol/K
  note: Dummy species (needed for defining the interfaces)

lithium-electrolyte-reactions:
- equation: Li(b) <=> Li+(e) + electron
  id: lithium_faradaic_reaction
  rate-constant: {A: 2.0e13, b: 0.0, Ea: 0.0}
  beta: 0.5

carbon-elyte-reactions:
- equation: 1 Li+(e) + 0.0625 S8(e) + 1 electron <=> 0.5 Li2S(e)
#- equation: 16 Li+(e) + 1 S8(e) + 16 electron <=> 8 Li2S(e)
  id: sulfur_reduction_1
  rate-constant: {A: 1.1e11, b: 0.0, Ea: 0.0}
  beta: 0.5
#- equation: S8(e) + 2 electron <=> S82-(e)
#  id: sulfur_reduction_2
#  rate-constant: {A: 1.1e5, b: 0.0, Ea: 0.0}
#  beta: 0.5

lithium-sulfide-elyte-reactions:
- equation: Li2S(e) <=> Li2S(s)
  id: LiSulfur_deposition
  rate-constant: {A: 0.5, b: 0.0, Ea: 0.0}

sulfur-elyte-reactions:
- equation: S8(s) <=> S8(e)
  id: sulfur_dissolution
  rate-constant: {A: 1e-4, b: 0.0, Ea: 0.0}

