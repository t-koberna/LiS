#===============================================================================
#  input_template.yaml
#
#  User inputs for bat-can model creation and running.
#===============================================================================

cell-description:
  anode:
    bulk-phase: 'lithium_metal'                               # Cantera phase name
    surf-phase: 'lithium_electrolyte'                         
    conductor-phase: 'electron'                               
    thickness: 15e-6                                          # Initial anode thickness, [m]
    C_dl: 1.5e-1                                              # Double layer capacity, [F/m2]
    
  separator:
    phi_0: 2.75 #2.825 #1.0                                   # Initial electric potential, V
    electrolyte-phase: 'electrolyte'                          # Cantera phase name
    n_points: 3                                               # number of nodes
    thickness: 30e-6                                          # separator thickness, [m]
    transport:
      mobile-ion:  'Li+(e)'                                   # Species name for Li+ in elyte.
      model: 'dilute-solution'                                # Elyte transport model
      diffusion-coefficients:                                 
        - species: 'Li+(e)'
          D_k: 1e-10                                          # Species Diffusion coeff, [m^2/s]
          C_k: 1.024e-1                                       # Initial concentration, [kmol_k/m^3]
          name: 'Li+(e)'                                      # Species name for when I want to pick one out of an array
          name-plot: '$\rm Li+$'                              # Species name formatted for plotting
        - species: S8(e)
          D_k: 1e-11
          C_k: 1.86e-3 
          name: S8(e)
          name-plot: '$\rm S_8$'
        - species: S82-(e)
          D_k: 1e-11
          C_k: 0 
          name: S82-(e)
          name-plot: '$\rm S_8^{2-}$'
        - species: Li2S(e)
          D_k: 1.1e-11
          C_k: 5e-6 
          name: 'Li2S(e)'
          name-plot: '$\rm Li_2S$'
        - species: 'TEGDME(e)'
          D_k: 1e-11
          C_k: 1.023e-5 
          name: 'TEGDME(e)'
          name-plot: '$\rm TEGDME$'
        - species: 'TFSI-(e)'
          D_k: 4e-9
          C_k: 1.024e-1 
          name: 'TFSI-(e)'
          name-plot: '$\rm TFSI-$'
   
  cathode:
    phi_0: 2.8 # 5.05 #2.946                                        # Initial electric potential, [V]
    host-phase: 'carbon'                                      # Cantera phase name
    surf-phase: 'carbon_electrolyte'                          
    conversion-phases:                                        # Phases used for growth
      - bulk-name: "sulfur"                                   
        surf-name: "sulfur_surf"                           
        elyte-name: "S8(e)"               
      - bulk-name: "lithium_sulfide"                          
        surf-name: "lithium_sulfide_surf"                    
        elyte-name: "Li2S(s)"
    nucleation:                                               # Includes all species that can nucleate
      - species: 'Li2S'
        num-buckets: 150
        bucket-thciness: 8e-10
      - species: 'S8'
        num-buckets: 150
        bucket-thciness: 8e-10
    C_dl: 2.5e-1                                              # Double layer capacity, [F/m2]

### Simulation parameters:
parameters:
  T: 25.15 C                                                  # Cell temperature
  P: 101325 Pa                                                # Cell pressure
  simulations:
    equilibrate:
        enable: True                                          # Start with a hold at open circuit?
        time: 300                                              # If true, how long is the hold, [s]
        plot_flag: False                                       # Do you want to generate plots after the equilibration?
    i_ext: 0.1 A/cm2                                          # the external current, [A/m2]
    time_max: 100                                             # max time for the simulation, [s]
    number-bins:
      Li2S: 10
      S8: 10
  plot-species:                                               # Determines which species get their own concentration plots
    - name: 'Li+(e)'
    #- name: 'TEGDME(e)'
    #- name: 'S8(e)'


### Cantera inputs:
phases:
- name: lithium_metal
  thermo: fixed-stoichiometry
  species: ['Li(b)']
  density: 0.534 g/cm^3
  state:
    T: 300.0 K
    P: 1 atm

- name: carbon
  thermo: fixed-stoichiometry
  elements: [E]
  species: [electron]
  state:
    T: 300.0 K
    P: 1 atm
    X: {electron: 1.0}
  density: 2260 kg/m^3

- name: sulfur_surf
  thermo: ideal-surface
  species: [(dummy)]
  kinetics: surface
  reactions: [sulfur-elyte-reactions]
  state:
    T: 300.0 K
    P: 1 atm

- name: sulfur
  thermo: fixed-stoichiometry
  species: [S8(s)]
  density: 2.07e3 kg/m^3
  state:
    T: 300.0 K
    P: 1 atm

- name: lithium_sulfide
  thermo: fixed-stoichiometry
  species: [Li2S(s)]
  density: 1640 kg/m^3
  state:
    T: 300.0 K
    P: 1 atm

- name: lithium_sulfide_surf
  thermo: ideal-surface
  species: [(dummy)]
  kinetics: surface
  reactions: [lithium-sulfide-elyte-reactions]
  state:
    T: 300.0 K
    P: 1 atm
  site-density: 3.48e-2
  
- name: electron
  thermo: electron-cloud
  elements: [E]
  species: [electron]
  state:
    X: {electron: 1.0}
  density: 1.0 kg/m^3

- name: lithium_electrolyte
  thermo: ideal-surface
  species: [(dummy)]
  kinetics: surface
  reactions: [lithium-electrolyte-reactions]
  site-density: 3.48e-2

- name: carbon_electrolyte
  thermo: ideal-surface
  species: [(dummy)]
  kinetics: surface
  reactions: [carbon-elyte-reactions]
  site-density: 3.48e-2

- name: electrolyte
  thermo: ideal-condensed
  elements: [Li, C, F, N, H, O, E, S]
  species: [Li+(e), S8(e), S82-(e), Li2S(e), TEGDME(e), TFSI-(e)]
  state:
    T: 300.0
    P: 1 atm
    #X: {Li+(e): 1.0e-5, S8(e): 2.0e-2, Li2S(e): 8.0e-10}
  standard-concentration-basis: unity
  kinetics: gas
  reactions: [bulk-elyte-reactions]

species:
- name: TFSI-(e)
  composition: {C: 2, F: 6, S: 2, O: 4, N: 1, E: 1}
  thermo:
    model: constant-cp
    h0: 0.0 kJ/mol
    s0: 0.0 J/mol/K
  equation-of-state:
    model: constant-volume
    molar-volume: 147.4 cm^3/mol
- name: TEGDME(e)
