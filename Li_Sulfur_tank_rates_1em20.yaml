#===============================================================================
#  input_template.yaml
#
#  User inputs for bat-can model creation and running.
#===============================================================================

cell-description:
    
  tank:
    electrolyte-phase: 'electrolyte' # Cantera phase name
    n_points: 1
    #thickness: 30e-2  # separator thickness, m
    transport:
      model: 'dilute-solution'
      diffusion-coefficients:
        - species: 'TEGDME(e)'
          D_k: 1e-12
          C_k: 4.54 # kmol_k/m^3
          name: TEGDME(e)
          name-plot: '$\rm TEGDME$'
        - species: S8(e)
          D_k: 1e-11
          C_k: 0 #1.0e-12  # kmol_k/m^3
          name: S8(e)
          name-plot: '$\rm S_8$'
        - species: S7(e)
          D_k: 1e-11
          C_k: 0 # kmol_k/m^3
          name: S7(e)
          name-plot: '$\rm S_7$'
        - species: S6(e)
          D_k: 1e-11
          C_k: 0 # kmol_k/m^3
          name: S6(e)
          name-plot: '$\rm S_6$'
        - species: S5(e)
          D_k: 1e-11
          C_k: 0 # kmol_k/m^3
          name: S5(e)
          name-plot: '$\rm S_5$'
        - species: S4(e)
          D_k: 1e-11
          C_k: 0 # kmol_k/m^3
          name: S4(e)
          name-plot: '$\rm S_4$'
        - species: S3(e)
          D_k: 1e-11
          C_k: 0 # kmol_k/m^3
          name: S3(e)
          name-plot: '$\rm S_3$'
        - species: S2(e)
          D_k: 1e-11
          C_k: 0 # kmol_k/m^3
          name: S2(e)
          name-plot: '$\rm S_2$'
        - species: S(e)
          D_k: 1e-11
          C_k: 0 # kmol_k/m^3
          name: S(e)
          name-plot: '$\rm S$'
        - species: Li2S8(e)
          D_k: 6e-11
          C_k: 0 # kmol_k/m^3
          name: Li2S8(e)
          name-plot: '$\rm Li_2S_8$'
        - species: Li2S7(e)
          D_k: 1e-10
          C_k: 0 # kmol_k/m^3
          name: Li2S7(e)
          name-plot: '$\rm Li_2S_7$'
        - species: Li2S6(e)
          D_k: 6e-11
          C_k: 0.0 # kmol_k/m^3
          name: Li2S6(e)
          name-plot: '$\rm Li_2S_6$'
        - species: Li2S5(e)
          D_k: 1e-10
          C_k: 0 # kmol_k/m^3
          name: Li2S5(e)
          name-plot: '$\rm Li_2S_5$'
        - species: Li2S4(e)
          D_k: 1e-10
          C_k: 0 # kmol_k/m^3
          name: Li2S4(e)
          name-plot: '$\rm Li_2S_4$'
        - species: Li2S3(e)
          D_k: 1e-10
          C_k: 0 # kmol_k/m^3
          name: Li2S3(e)
          name-plot: '$\rm Li_2S_3$'
        - species: Li2S2(e)
          D_k: 1e-10
          C_k: 0 # kmol_k/m^3
          name: Li2S2(e)
          name-plot: '$\rm Li_2S_2$'
        - species: Li2S(e)
          D_k: 1e-10
          C_k: 0 #1.0e-12  # kmol_k/m^3
          name: 'Li2S(e)'
          name-plot: '$\rm Li_2S$'
  solid:
    host-phase_S8: 'sulfur'                                      # Cantera phase name
    surf-phase_S8: 'sulfur_surf'       
    host-phase_Li2S: 'lithium_sulfide'                                      # Cantera phase name
    surf-phase_Li2S: 'lithium_sulfide_surf' 
    mass-S8: 2e-13    # kg of S8(s)  
    mass-Li2S: 2e-13    # kg of S8(s)                                        
    #conversion-phases:                                        # Phases used for growth
      #- bulk-name: "sulfur"                                   
      #  surf-name: "sulfur_surf"                           
      #  elyte-name: "S8(e)"               
      #- bulk-name: "lithium_sulfide"                          
      #  surf-name: "lithium_sulfide_surf"                    
      #  elyte-name: "Li2S(s)"
   
# Simulation parameters:
parameters:
  T: 25.15 C
  P: 101325 Pa

# Cantera inputs:
phases:
- name: electrolyte
  thermo: ideal-condensed
  elements: [Li, C, F, N, H, O, E, S]
  species: [TEGDME(e), S8(e), S7(e), S6(e), S5(e),
            S4(e), S3(e), S2(e),  S(e), Li2S8(e), Li2S7(e), 
            Li2S6(e), Li2S5(e), Li2S4(e), Li2S3(e), Li2S2(e), Li2S(e)] #, TFSI-(e)
  state:
    T: 300.0
    P: 1 atm
    X: {TEGDME(e): 1.0, S8(e): 0, S7(e): 0,  S6(e): 0,  
        S5(e): 0, S4(e): 0, S3(e): 0,  S2(e): 0,  S(e): 0, 
        Li2S8(e): 0, Li2S7(e): 0, Li2S6(e): 0, Li2S5(e): 0, Li2S4(e): 0, Li2S3(e): 0, Li2S2(e): 0, Li2S(e): 0} #TFSI-(e): 0,
  standard-concentration-basis: unity
  kinetics: gas
  reactions: [bulk-elyte-reactions]

- name: sulfur
  thermo: fixed-stoichiometry
  species: [S8(s)]
  density: 2.07e3 kg/m^3
  state:
    T: 300.0 K
    P: 1 atm

- name: lithium_sulfide
  thermo: fixed-stoichiometry
  species: [Li2S(s)]
  density: 1640 kg/m^3
  state:
    T: 300.0 K
    P: 1 atm

- name: sulfur_surf
  thermo: ideal-surface
  species: [(dummy)]
  kinetics: surface
  reactions: [sulfur-elyte-reactions]
  state:
    T: 300.0 K
    P: 1 atm

- name: lithium_sulfide_surf
  thermo: ideal-surface
  species: [(dummy)]
  kinetics: surface
  reactions: [lithium-sulfide-elyte-reactions]
  state:
    T: 300.0 K
    P: 1 atm
  site-density: 3.48e-2

