lithium-sulfide-elyte-reactions:
- equation: Li2S(e) <=> Li2S(s)
  id: LiSulfur_deposition
  rate-constant: {A: 0.5e-3, b: 0.0, Ea: 0.0}

sulfur-elyte-reactions:
- equation: S8(s) <=> S8(e)
  id: sulfur_dissolution
  rate-constant: {A: 1.9e-13, b: 0.0, Ea: 0.0}

bulk-elyte-reactions:
- equation: 1 S8(e) <=> 1 S7(e) + 1 S(e)
  id: sulfur_disproportionation_1
  rate-constant: {A: 1.1e-13, b: 0.0, Ea: 0.0}
  #rate-constant: {A: 1.1e-180, b: 0.0, Ea: 0.0}

